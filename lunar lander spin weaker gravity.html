<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Lander</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none; 
        }
        h1 { margin: 10px 0; font-size: 24px; text-shadow: 0 0 10px #00ff00; }
        canvas { border: 4px solid #333; background-color: #000; outline: none; }
        #instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
            line-height: 1.4;
        }
        .highlight { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <h1>LUNAR LANDER</h1>
    <canvas id="gameCanvas" width="800" height="500" tabindex="0"></canvas>

    <div id="instructions">
        Move: [W/A/S/D] or [Arrows] | Spin CW: [O/F] | Spin CCW: [P/G]<br>
        Press <span class="highlight">[SPACEBAR]</span> to Restart. Land softly on flat ground!
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const GRAVITY = 0.005; 
        const THRUST = 0.1; 
        const SPIN_ACCEL = 0.003;
        const SAFE_LANDING_SPEED = 1.2;
        const SAFE_LANDING_ANGLE = 0.2;

        let lander = null;
        let groundY = 450;
        let gameState = "playing"; 

        const activeKeys = {};
        window.addEventListener("keydown", (e) => {
            let key = e.key ? e.key.toLowerCase() : "";
            activeKeys[key] = true;
            if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) e.preventDefault(); 
            if (key === " " && gameState !== "playing") resetGame();
        });
        window.addEventListener("keyup", (e) => { activeKeys[e.key.toLowerCase()] = false; });

        class Lander {
            constructor(x, y, angle) {
                this.x = x; this.y = y;
                this.vx = 0; this.vy = 0;
                this.angle = angle; this.angularVelocity = 0;
                this.width = 30; this.height = 20;
                this.fuel = 2000;
                this.state = "playing";
            }

            update() {
                if (this.state !== "playing") return;

                this.vy += GRAVITY;
                this.angle += this.angularVelocity;
                
                if (this.fuel > 0) {
                    if (activeKeys['w'] || activeKeys['arrowup']) { 
                        this.vy -= THRUST * Math.cos(this.angle);
                        this.vx += THRUST * Math.sin(this.angle);
                        this.fuel -= 1;
                    }
                    if (activeKeys['s'] || activeKeys['arrowdown']) { 
                        this.vy += THRUST * Math.cos(this.angle);
                        this.vx -= THRUST * Math.sin(this.angle);
                        this.fuel -= 1;
                    }
                    if (activeKeys['a'] || activeKeys['arrowleft']) { 
                        this.vx -= THRUST;
                        this.fuel -= 1;
                    }
                    if (activeKeys['d'] || activeKeys['arrowright']) { 
                        this.vx += THRUST;
                        this.fuel -= 1;
                    }
                    if (activeKeys['o'] || activeKeys['f']) { 
                        this.angularVelocity += SPIN_ACCEL;
                        this.fuel -= 0.5;
                    }
                    if (activeKeys['p'] || activeKeys['g']) { 
                        this.angularVelocity -= SPIN_ACCEL;
                        this.fuel -= 0.5;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;

                this.checkCollisions();
            }

            checkCollisions() {
                const legOffset = 15;
                const cosA = Math.cos(this.angle);
                const sinA = Math.sin(this.angle);
                
                const leftLegY = this.y + (this.height/2 * cosA) + (legOffset * sinA);
                const rightLegY = this.y + (this.height/2 * cosA) - (legOffset * sinA);

                if (leftLegY >= groundY || rightLegY >= groundY) {
                    const isSlowEnough = Math.abs(this.vy) < SAFE_LANDING_SPEED && Math.abs(this.vx) < SAFE_LANDING_SPEED;
                    const isUpright = Math.abs(this.angle % (Math.PI * 2)) < SAFE_LANDING_ANGLE || Math.abs((this.angle % (Math.PI * 2)) - Math.PI * 2) < SAFE_LANDING_ANGLE;

                    if (isSlowEnough && isUpright) {
                        this.state = "landed";
                        gameState = "win";
                    } else {
                        this.state = "crashed";
                        gameState = "crashed";
                    }
                    this.vx = 0; this.vy = 0; this.angularVelocity = 0;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                if (this.state === "crashed") {
                    ctx.fillStyle = "#555";
                    // Twisted body metal
                    ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(10, 5); ctx.lineTo(0, 10); ctx.lineTo(-15, 5); ctx.fill();
                    // Broken leg
                    ctx.strokeStyle = "#777"; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-20, 15); ctx.stroke();
                    // Debris
                    ctx.fillStyle = "#333";
                    ctx.fillRect(5, 5, 10, 10);
                    ctx.fillRect(-15, 8, 5, 5);
                } else {
                    // Main thrusters
                    ctx.fillStyle = "#ff5500";
                    if (activeKeys['w'] || activeKeys['arrowup']) { ctx.beginPath(); ctx.moveTo(-5, 10); ctx.lineTo(0, 30 + Math.random()*5); ctx.lineTo(5, 10); ctx.fill(); }
                    if (activeKeys['s'] || activeKeys['arrowdown']) { ctx.beginPath(); ctx.moveTo(-5, -10); ctx.lineTo(0, -30 - Math.random()*5); ctx.lineTo(5, -10); ctx.fill(); }
                    if (activeKeys['a'] || activeKeys['arrowleft']) { ctx.beginPath(); ctx.moveTo(15, -5); ctx.lineTo(35 + Math.random()*5, 0); ctx.lineTo(15, 5); ctx.fill(); }
                    if (activeKeys['d'] || activeKeys['arrowright']) { ctx.beginPath(); ctx.moveTo(-15, -5); ctx.lineTo(-35 - Math.random()*5, 0); ctx.lineTo(-15, 5); ctx.fill(); }
                    
                    // Spinning Jets
                    ctx.fillStyle = "#ffaa00";
                    if (activeKeys['o'] || activeKeys['f']) { 
                        // CW Jets: Top Right and Bottom Left
                        ctx.fillRect(10, -12, 5, 5); 
                        ctx.fillRect(-15, 8, 5, 5);
                    }
                    if (activeKeys['p'] || activeKeys['g']) { 
                        // CCW Jets: Top Left and Bottom Right
                        ctx.fillRect(-15, -12, 5, 5); 
                        ctx.fillRect(10, 8, 5, 5);
                    }
                    
                    // Legs
                    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(-15, 20); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(10, 10); ctx.lineTo(15, 20); ctx.stroke();
                    
                    // Body
                    ctx.fillStyle = "#888888";
                    ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                    ctx.fillStyle = "#33aaff";
                    ctx.beginPath(); ctx.arc(0, -this.height / 2, 10, Math.PI, 0); ctx.fill();
                }
                ctx.restore();
            }
        }

        function resetGame() {
            let startX = Math.random() * (canvas.width - 100) + 50;
            let startY = Math.random() * 100 + 50;
            let startAngle = (Math.random() - 0.5) * Math.PI;
            lander = new Lander(startX, startY, startAngle);
            gameState = "playing";
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#333";
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            if (lander) {
                lander.update();
                lander.draw();
                ctx.fillStyle = "#fff";
                ctx.font = "16px Courier New";
                ctx.fillText(`FUEL: ${Math.max(0, Math.floor(lander.fuel))}`, 10, 20);
                
                if (gameState === "win") {
                    ctx.fillStyle = "#00ff00"; ctx.font = "20px Courier New";
                    ctx.fillText("SUCCESSFUL LANDING!", canvas.width/2 - 100, canvas.height/2);
                } else if (gameState === "crashed") {
                    ctx.fillStyle = "#ff3333"; ctx.font = "20px Courier New";
                    ctx.fillText("CRASHED!", canvas.width/2 - 40, canvas.height/2);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        resetGame();
        gameLoop();
    </script>
</body>
</html>

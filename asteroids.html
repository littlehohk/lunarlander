<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            pointer-events: none;
            user-select: none;
            display: none;
            z-index: 10;
        }
        .screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border: 2px solid white;
            border-radius: 8px;
            z-index: 20;
        }
        #startScreen {
            display: block;
        }
        #gameover {
            display: none;
        }
        h1 {
            font-size: 48px;
            margin-top: 0;
            margin-bottom: 30px;
        }
        p {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ccc;
        }
        .controls-section {
            margin-bottom: 25px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid white;
            border-radius: 4px;
            font-weight: bold;
            pointer-events: auto;
            transition: all 0.2s;
        }
        .option-btn {
            background-color: #333;
            color: #888;
            border-color: #555;
        }
        .option-btn:hover {
            background-color: #555;
            color: white;
        }
        .option-btn.selected {
            background-color: white;
            color: black;
            border-color: white;
        }
        #btnStartGame, #btnRestart {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
        }
        #btnStartGame:hover, #btnRestart:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
    </div>

    <div id="startScreen" class="screen">
        <h1>ASTEROIDS</h1>
        
        <div class="controls-section">
            <p>Movement Control</p>
            <button id="btnArrows" class="option-btn selected">Arrow Keys</button>
            <button id="btnWasd" class="option-btn">W-A-S-D Keys</button>
        </div>

        <div class="controls-section">
            <p>Fire Control</p>
            <button id="btnSpace" class="option-btn selected">Spacebar</button>
            <button id="btnMouse" class="option-btn">Mouse Left Click</button>
        </div>

        <button id="btnStartGame">START GAME</button>
    </div>

    <div id="gameover" class="screen">
        <h1>GAME OVER</h1>
        <button id="btnRestart">Restart</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const keys = {};
        
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
                e.preventDefault();
            }
        }, { passive: false });
        
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        window.addEventListener('mousedown', e => {
            if (e.button === 0) keys['MouseLeft'] = true;
        });

        window.addEventListener('mouseup', e => {
            if (e.button === 0) keys['MouseLeft'] = false;
        });

        const controlSchemes = {
            arrows: { forward: 'ArrowUp', backward: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' },
            wasd: { forward: 'KeyW', backward: 'KeyS', left: 'KeyA', right: 'KeyD' }
        };

        let activeControls = controlSchemes.arrows;
        let activeFire = 'space';
        let score = 0;
        let lives = 3;
        let gameState = 'START'; 

        class Ship {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.angle = -Math.PI / 2;
                this.vx = 0;
                this.vy = 0;
                this.radius = 12;
                this.invulnerable = 150;
            }

            update() {
                if (keys[activeControls.left]) this.angle -= 0.08;
                if (keys[activeControls.right]) this.angle += 0.08;
                
                if (keys[activeControls.forward]) {
                    this.vx += Math.cos(this.angle) * 0.15;
                    this.vy += Math.sin(this.angle) * 0.15;
                }
                if (keys[activeControls.backward]) {
                    this.vx -= Math.cos(this.angle) * 0.15;
                    this.vy -= Math.sin(this.angle) * 0.15;
                }

                this.x += this.vx;
                this.y += this.vy;

                this.vx *= 0.99;
                this.vy *= 0.99;

                this.wrap();
                if (this.invulnerable > 0) this.invulnerable--;
            }

            wrap() {
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                if (this.invulnerable > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-12, 10);
                ctx.lineTo(-5, 0);
                ctx.lineTo(-12, -10);
                ctx.closePath();
                
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(5, 0);
                ctx.lineTo(20, 0);
                ctx.stroke();
                
                if (keys[activeControls.forward] && Math.random() > 0.3) {
                    ctx.beginPath();
                    ctx.moveTo(-7, 0);
                    ctx.lineTo(-20, 5);
                    ctx.lineTo(-15, 0);
                    ctx.lineTo(-20, -5);
                    ctx.closePath();
                    ctx.strokeStyle = 'orange';
                    ctx.stroke();
                }

                if (keys[activeControls.backward] && Math.random() > 0.3) {
                    ctx.beginPath();
                    ctx.moveTo(10, -5);
                    ctx.lineTo(25, -15);
                    ctx.lineTo(15, -10);
                    ctx.moveTo(10, 5);
                    ctx.lineTo(25, 15);
                    ctx.lineTo(15, 10);
                    ctx.strokeStyle = 'lightblue';
                    ctx.stroke();
                }
                
                ctx.restore();
            }
        }

        class Asteroid {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 1.5 + 0.5) * (40 / radius);
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.vertices = Math.floor(Math.random() * 5 + 7);
                this.offsets = [];
                for (let i = 0; i < this.vertices; i++) {
                    this.offsets.push(Math.random() * 0.4 + 0.8);
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.wrap();
            }

            wrap() {
                if (this.x < -this.radius) this.x = canvas.width + this.radius;
                if (this.x > canvas.width + this.radius) this.x = -this.radius;
                if (this.y < -this.radius) this.y = canvas.height + this.radius;
                if (this.y > canvas.height + this.radius) this.y = -this.radius;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.beginPath();
                for (let i = 0; i < this.vertices; i++) {
                    const a = (i / this.vertices) * Math.PI * 2;
                    const r = this.radius * this.offsets[i];
                    const px = Math.cos(a) * r;
                    const py = Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * 10;
                this.vy = Math.sin(angle) * 10;
                this.life = 60;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        let ship = new Ship();
        let asteroids = [];
        let bullets = [];
        let lastShot = 0;
        let animationFrameId;

        function spawnAsteroids(count) {
            for (let i = 0; i < count; i++) {
                let x, y;
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (Math.hypot(x - ship.x, y - ship.y) < 150);
                asteroids.push(new Asteroid(x, y, 50));
            }
        }

        function fireBullet() {
            const now = Date.now();
            if (now - lastShot > 200) {
                const tipX = ship.x + Math.cos(ship.angle) * 20;
                const tipY = ship.y + Math.sin(ship.angle) * 20;
                bullets.push(new Bullet(tipX, tipY, ship.angle));
                lastShot = now;
            }
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ship.update();
            ship.draw();

            if ((activeFire === 'space' && keys['Space']) || (activeFire === 'mouse' && keys['MouseLeft'])) {
                fireBullet();
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                bullets[i].draw();
                if (bullets[i].life <= 0) bullets.splice(i, 1);
            }

            for (let i = asteroids.length - 1; i >= 0; i--) {
                asteroids[i].update();
                asteroids[i].draw();

                if (ship.invulnerable <= 0) {
                    const dist = Math.hypot(asteroids[i].x - ship.x, asteroids[i].y - ship.y);
                    if (dist < asteroids[i].radius + ship.radius) {
                        lives--;
                        document.getElementById('lives').innerText = lives;
                        if (lives <= 0) {
                            gameState = 'GAMEOVER';
                            document.getElementById('gameover').style.display = 'block';
                            keys['MouseLeft'] = false; 
                            keys['Space'] = false;
                        } else {
                            ship = new Ship();
                        }
                        break; 
                    }
                }

                let destroyed = false;
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const dist = Math.hypot(asteroids[i].x - bullets[j].x, asteroids[i].y - bullets[j].y);
                    if (dist < asteroids[i].radius) {
                        const a = asteroids[i];
                        bullets.splice(j, 1);
                        destroyed = true;
                        
                        score += Math.floor(1000 / a.radius);
                        document.getElementById('score').innerText = score;
                        
                        if (a.radius > 20) {
                            asteroids.push(new Asteroid(a.x, a.y, a.radius / 1.8));
                            asteroids.push(new Asteroid(a.x, a.y, a.radius / 1.8));
                        }
                        break;
                    }
                }

                if (destroyed) {
                    asteroids.splice(i, 1);
                }
            }

            if (asteroids.length === 0) {
                spawnAsteroids(5);
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        let selectedMovement = 'arrows';
        let selectedFire = 'space';

        function updateSelectionUI() {
            document.getElementById('btnArrows').className = selectedMovement === 'arrows' ? 'option-btn selected' : 'option-btn';
            document.getElementById('btnWasd').className = selectedMovement === 'wasd' ? 'option-btn selected' : 'option-btn';
            
            document.getElementById('btnSpace').className = selectedFire === 'space' ? 'option-btn selected' : 'option-btn';
            document.getElementById('btnMouse').className = selectedFire === 'mouse' ? 'option-btn selected' : 'option-btn';
        }

        document.getElementById('btnArrows').addEventListener('click', () => { selectedMovement = 'arrows'; updateSelectionUI(); });
        document.getElementById('btnWasd').addEventListener('click', () => { selectedMovement = 'wasd'; updateSelectionUI(); });
        document.getElementById('btnSpace').addEventListener('click', () => { selectedFire = 'space'; updateSelectionUI(); });
        document.getElementById('btnMouse').addEventListener('click', () => { selectedFire = 'mouse'; updateSelectionUI(); });

        document.getElementById('btnStartGame').addEventListener('click', () => {
            activeControls = controlSchemes[selectedMovement];
            activeFire = selectedFire;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            resetGame();
        });

        function resetGame() {
            score = 0;
            lives = 3;
            gameState = 'PLAYING';
            asteroids = [];
            bullets = [];
            ship = new Ship();
            
            keys['MouseLeft'] = false; 
            keys['Space'] = false;

            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = lives;
            document.getElementById('gameover').style.display = 'none';
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            
            spawnAsteroids(5);
            gameLoop();
        }

        document.getElementById('btnRestart').addEventListener('click', resetGame);
        
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>

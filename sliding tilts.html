<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sliding Tile Puzzle</title>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f0f2f5; }
  h1 { margin-bottom: 10px; }
  #board { display: grid; grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); gap: 6px; background: #333; padding: 6px; border-radius: 8px; margin-bottom: 20px; }
  .tile { width: 80px; height: 80px; background: #007bff; color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; border-radius: 4px; cursor: pointer; user-select: none; transition: background 0.2s; }
  .tile:hover { background: #0056b3; }
  .tile.empty { background: transparent; cursor: default; }
  .instructions { font-size: 14px; color: #555; text-align: center; max-width: 280px; line-height: 1.4; margin-bottom: 15px; }
  button { padding: 8px 16px; font-size: 14px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
  button:hover { background: #218838; }
</style>
</head>
<body>
<h1>Sliding Puzzle</h1>
<div class="instructions">Click any tile adjacent to the empty space to slide it. Arrange the numbers in order from 1 to 8.</div>
<div id="board"></div>
<button onclick="resetGame()">Restart</button>

<script>
  let board = [
    [1, 2, 3],
    [4, 5, 6],
    [7, 8, 0]
  ];

  const boardEl = document.getElementById("board");

  function render() {
    boardEl.innerHTML = "";
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const val = board[r][c];
        const tile = document.createElement("div");
        tile.className = "tile" + (val === 0 ? " empty" : "");
        if (val !== 0) {
          tile.textContent = val;
          tile.addEventListener("click", () => moveTile(r, c));
        }
        boardEl.appendChild(tile);
      }
    }
  }

  function getEmptyPos() {
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        if (board[r][c] === 0) return { r, c };
      }
    }
  }

  function moveTile(r, c) {
    const empty = getEmptyPos();
    const isAdjacent = (Math.abs(r - empty.r) + Math.abs(c - empty.c)) === 1;
    if (isAdjacent) {
      board[empty.r][empty.c] = board[r][c];
      board[r][c] = 0;
      render();
      checkWin();
    }
  }

  function checkWin() {
    const winningState = [
      [1, 2, 3],
      [4, 5, 6],
      [7, 8, 0]
    ];
    let won = true;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        if (board[r][c] !== winningState[r][c]) {
          won = false;
          break;
        }
      }
    }
    if (won) {
      setTimeout(() => alert("Congratulations! You solved the puzzle."), 100);
    }
  }

  function shuffle() {
    for (let i = 0; i < 100; i++) {
      const empty = getEmptyPos();
      const neighbors = [];
      const dr = [-1, 1, 0, 0];
      const dc = [0, 0, -1, 1];
      for (let d = 0; d < 4; d++) {
        let nr = empty.r + dr[d];
        let nc = empty.c + dc[d];
        if (nr >= 0 && nr < 3 && nc >= 0 && nc < 3) {
          neighbors.push({ r: nr, c: nc });
        }
      }
      const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
      board[empty.r][empty.c] = board[randomNeighbor.r][randomNeighbor.c];
      board[randomNeighbor.r][randomNeighbor.c] = 0;
    }
    
    let won = true;
    const winningState = [[1, 2, 3], [4, 5, 6], [7, 8, 0]];
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        if (board[r][c] !== winningState[r][c]) won = false;
      }
    }
    if (won) shuffle();
  }

  function resetGame() {
    board = [
      [1, 2, 3],
      [4, 5, 6],
      [7, 8, 0]
    ];
    shuffle();
    render();
  }

  resetGame();
</script>
</body>
</html>
